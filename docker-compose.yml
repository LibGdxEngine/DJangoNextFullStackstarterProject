name: mobser-dev

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.project,com.docker.compose.service"

services:
  db:
    logging: *service-logging
    command: [postgres, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    logging: *service-logging
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_sessions:
    logging: *service-logging
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    volumes:
      - auth_session_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    logging: *service-logging
    networks: [default, telemetry-ingest]
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ocr_private:/app/private/ocr
      - ./backend:/app
      - ./scripts:/app/scripts:ro
    environment:
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_PRIVATE_ROOT=/app/private/ocr
      - OCR_WEBHOOK_SIGNING_KEY=${OCR_WEBHOOK_SIGNING_KEY:-}
      - OCR_MAX_PENDING_PER_ORG=${OCR_MAX_PENDING_PER_ORG:-5}
      - OCR_MAX_DAILY_BYTES=${OCR_MAX_DAILY_BYTES:-1500000000}
      - OCR_MAX_STORED_BYTES=${OCR_MAX_STORED_BYTES:-1500000000}
      - OCR_MAX_GLOBAL_PENDING=${OCR_MAX_GLOBAL_PENDING:-50}
      - OCR_MAX_GLOBAL_STORED_BYTES=${OCR_MAX_GLOBAL_STORED_BYTES:-7500000000}
      - OCR_RESULT_RETENTION_HOURS=${OCR_RESULT_RETENTION_HOURS:-24}
      - RATE_LIMIT_PROXY_TOKEN=${RATE_LIMIT_PROXY_TOKEN:-dev-rate-proxy-token-not-for-production}
      - RATE_LIMIT_KEY_SECRET=${RATE_LIMIT_KEY_SECRET:-dev-rate-limit-key-not-for-production}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/1
      - RATE_LIMIT_MODE=${RATE_LIMIT_MODE:-enforce}
      - RATE_LIMIT_BASELINE_MODE=${RATE_LIMIT_BASELINE_MODE:-enforce}
      - RATE_LIMIT_POLICIES=${RATE_LIMIT_POLICIES:-}
      - RATE_LIMIT_ANONYMOUS=${RATE_LIMIT_ANONYMOUS:-60/min}
      - RATE_LIMIT_USER=${RATE_LIMIT_USER:-300/min}
      - RATE_LIMIT_STATUS=${RATE_LIMIT_STATUS:-30/min}
      - RATE_LIMIT_REDIS_TIMEOUT=${RATE_LIMIT_REDIS_TIMEOUT:-0.3}
      - RATE_LIMIT_TRUST_PROXY=true
      - RATE_LIMIT_ALLOW_DIRECT=false
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=mobser-backend
      - OTEL_SERVICE_VERSION=${APP_VERSION:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1}
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=development
      - DEPLOYMENT_ENVIRONMENT=development
      - OTEL_METRIC_EXPORT_INTERVAL=30000
      - OTEL_EXPORTER_OTLP_TIMEOUT=5
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-secret-key-template-project-1234}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - OTP_SECRET=${OTP_SECRET:-dev-otp-secret-key-32-chars-minimum-mobser}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@mobser.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    logging: *service-logging
    networks: [default, telemetry-ingest]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info -Q celery,maintenance
    volumes:
      - ocr_private:/app/private/ocr
      - ./backend:/app
    environment:
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_PRIVATE_ROOT=/app/private/ocr
      - OCR_WEBHOOK_SIGNING_KEY=${OCR_WEBHOOK_SIGNING_KEY:-}
      - OCR_MAX_PENDING_PER_ORG=${OCR_MAX_PENDING_PER_ORG:-5}
      - OCR_MAX_DAILY_BYTES=${OCR_MAX_DAILY_BYTES:-1500000000}
      - OCR_MAX_STORED_BYTES=${OCR_MAX_STORED_BYTES:-1500000000}
      - OCR_MAX_GLOBAL_PENDING=${OCR_MAX_GLOBAL_PENDING:-50}
      - OCR_MAX_GLOBAL_STORED_BYTES=${OCR_MAX_GLOBAL_STORED_BYTES:-7500000000}
      - OCR_RESULT_RETENTION_HOURS=${OCR_RESULT_RETENTION_HOURS:-24}
      - RATE_LIMIT_PROXY_TOKEN=${RATE_LIMIT_PROXY_TOKEN:-dev-rate-proxy-token-not-for-production}
      - RATE_LIMIT_KEY_SECRET=${RATE_LIMIT_KEY_SECRET:-dev-rate-limit-key-not-for-production}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/1
      - RATE_LIMIT_MODE=${RATE_LIMIT_MODE:-enforce}
      - RATE_LIMIT_BASELINE_MODE=${RATE_LIMIT_BASELINE_MODE:-enforce}
      - RATE_LIMIT_POLICIES=${RATE_LIMIT_POLICIES:-}
      - RATE_LIMIT_ANONYMOUS=${RATE_LIMIT_ANONYMOUS:-60/min}
      - RATE_LIMIT_USER=${RATE_LIMIT_USER:-300/min}
      - RATE_LIMIT_STATUS=${RATE_LIMIT_STATUS:-30/min}
      - RATE_LIMIT_REDIS_TIMEOUT=${RATE_LIMIT_REDIS_TIMEOUT:-0.3}
      - RATE_LIMIT_TRUST_PROXY=true
      - RATE_LIMIT_ALLOW_DIRECT=false
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=mobser-worker
      - OTEL_SERVICE_VERSION=${APP_VERSION:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1}
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=development
      - DEPLOYMENT_ENVIRONMENT=development
      - OTEL_METRIC_EXPORT_INTERVAL=30000
      - OTEL_EXPORTER_OTLP_TIMEOUT=5
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-secret-key-template-project-1234}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - OTP_SECRET=${OTP_SECRET:-dev-otp-secret-key-32-chars-minimum-mobser}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@mobser.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Enable with --profile ocr after configuring the GPU endpoint and signing key.
  ocr_upload:
    extends:
      service: backend
    profiles: [ocr]
    command: [gunicorn, --config, gunicorn.conf.py, --bind, '0.0.0.0:8000', --workers, '2', --worker-class, gthread, --threads, '4', --timeout, '330', core.wsgi:application]
    environment:
      - OTEL_SERVICE_NAME=mobser-ocr-upload
      - SKIP_DATABASE_SETUP=true
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 6m
    ports: !reset []

  ocr_worker:
    extends:
      service: celery_worker
    profiles: [ocr]
    command: [celery, -A, core, worker, -l, info, -Q, ocr, "--concurrency=${OCR_WORKER_CONCURRENCY:-1}", --max-tasks-per-child=20]
    networks: [default, telemetry-ingest, ocr-scan]
    environment:
      - OCR_MODEL_URL=${OCR_MODEL_URL:-}
      - OCR_MODEL_TOKEN=${OCR_MODEL_TOKEN:-}
      - OCR_MODEL_FILE_FIELD=${OCR_MODEL_FILE_FIELD:-file}
      - OCR_CLAMAV_HOST=clamav
      - OTEL_SERVICE_NAME=mobser-ocr-worker
    depends_on:
      clamav:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2.0
    read_only: true
    tmpfs: [/tmp:size=192m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20m

  ocr_webhooks:
    extends:
      service: celery_worker
    profiles: [ocr]
    command: [celery, -A, core, worker, -l, info, -Q, ocr-webhooks, --concurrency=2]
    environment:
      - OTEL_SERVICE_NAME=mobser-ocr-webhooks
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  clamav:
    image: clamav/clamav:1.4
    profiles: [ocr]
    restart: unless-stopped
    networks: [ocr-scan, ocr-scanner-updates]
    mem_limit: 4g
    volumes:
      - clamav_signatures:/var/lib/clamav
      - ./security/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: [CMD, clamdscan, --ping, "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging: *service-logging

  celery_beat:
    logging: *service-logging
    networks: [default, telemetry-ingest]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app
    environment:
      - RATE_LIMIT_PROXY_TOKEN=${RATE_LIMIT_PROXY_TOKEN:-dev-rate-proxy-token-not-for-production}
      - RATE_LIMIT_KEY_SECRET=${RATE_LIMIT_KEY_SECRET:-dev-rate-limit-key-not-for-production}
      - RATE_LIMIT_REDIS_URL=redis://redis:6379/1
      - RATE_LIMIT_MODE=${RATE_LIMIT_MODE:-enforce}
      - RATE_LIMIT_BASELINE_MODE=${RATE_LIMIT_BASELINE_MODE:-enforce}
      - RATE_LIMIT_POLICIES=${RATE_LIMIT_POLICIES:-}
      - RATE_LIMIT_ANONYMOUS=${RATE_LIMIT_ANONYMOUS:-60/min}
      - RATE_LIMIT_USER=${RATE_LIMIT_USER:-300/min}
      - RATE_LIMIT_STATUS=${RATE_LIMIT_STATUS:-30/min}
      - RATE_LIMIT_REDIS_TIMEOUT=${RATE_LIMIT_REDIS_TIMEOUT:-0.3}
      - RATE_LIMIT_TRUST_PROXY=true
      - RATE_LIMIT_ALLOW_DIRECT=false
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=mobser-beat
      - OTEL_SERVICE_VERSION=${APP_VERSION:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1}
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=development
      - DEPLOYMENT_ENVIRONMENT=development
      - OTEL_METRIC_EXPORT_INTERVAL=30000
      - OTEL_EXPORTER_OTLP_TIMEOUT=5
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-secret-key-template-project-1234}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - OTP_SECRET=${OTP_SECRET:-dev-otp-secret-key-32-chars-minimum-mobser}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@mobser.local}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    logging: *service-logging
    networks: [default, telemetry-ingest]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - RATE_LIMIT_PROXY_TOKEN=${RATE_LIMIT_PROXY_TOKEN:-dev-rate-proxy-token-not-for-production}
      - RATE_LIMIT_TRUST_PROXY=true
      - RATE_LIMIT_ALLOW_DIRECT=false
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=mobser-frontend
      - OTEL_SERVICE_VERSION=${APP_VERSION:-development}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1}
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=development
      - DEPLOYMENT_ENVIRONMENT=development
      - OTEL_METRIC_EXPORT_INTERVAL=30000
      - OTEL_EXPORTER_OTLP_TIMEOUT=5
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-a-secure-nextauth-secret-key-change-this-in-dev}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000/api}
      - AUTH_SESSION_REDIS_URL=${AUTH_SESSION_REDIS_URL:-redis://auth_sessions:6379/0}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      auth_sessions:
        condition: service_healthy

  caddy:
    logging: *service-logging
    networks:
      default:
      telemetry-storage:
      telemetry-proxy:
        ipv4_address: ${OBSERVABILITY_CADDY_IP:-172.30.240.2}
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      - RATE_LIMIT_PROXY_TOKEN=${RATE_LIMIT_PROXY_TOKEN:-dev-rate-proxy-token-not-for-production}
      - OCR_UPLOAD_UPSTREAM=${OCR_UPLOAD_UPSTREAM:-backend:8000}
      - GRAFANA_PROXY_IP=${OBSERVABILITY_GRAFANA_IP:-172.30.240.3}
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.project,com.docker.compose.service
    networks:
    - telemetry-ingest
    - telemetry-storage
    user: 0:0
    command:
    - --config=/etc/otelcol/config.yaml
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      DEPLOYMENT_ENVIRONMENT: development
    volumes:
    - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    - ${DOCKER_LOG_ROOT:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
    - /:/hostfs:ro
    - otel_offsets:/var/lib/otelcol
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.project,com.docker.compose.service
    networks:
    - telemetry-storage
    command:
    - -config.file=/etc/loki/config.yaml
    volumes:
    - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    - loki_data:/loki
  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.project,com.docker.compose.service
    networks:
    - telemetry-storage
    command:
    - -config.file=/etc/tempo/config.yaml
    volumes:
    - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
    - tempo_data:/var/tempo
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.project,com.docker.compose.service
    networks:
    - telemetry-storage
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --storage.tsdb.retention.size=2GB
    - --log.format=json
    volumes:
    - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    - prometheus_data:/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:9090/-/ready
      interval: 30s
      timeout: 5s
      retries: 3
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.project,com.docker.compose.service
    networks:
      telemetry-storage: null
      telemetry-proxy:
        ipv4_address: ${OBSERVABILITY_GRAFANA_IP:-172.30.240.3}
    environment:
      GF_SERVER_ROOT_URL: ${OBSERVABILITY_ROOT_URL:-http://localhost/observability/}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SERVER_HTTP_ADDR: ${OBSERVABILITY_GRAFANA_IP:-172.30.240.3}
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_PROXY_WHITELIST: ${OBSERVABILITY_CADDY_IP:-172.30.240.2}
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_DISABLE_SIGNOUT_MENU: 'true'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
      GF_SECURITY_COOKIE_SECURE: 'false'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_AUTO_ASSIGN_ORG: 'true'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: 'false'
      GF_EXPLORE_ENABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
      GF_METRICS_ENABLED: 'true'
      GF_LIVE_ALLOWED_ORIGINS: ${OBSERVABILITY_ROOT_ORIGIN:-http://localhost}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  ocr_private:
  clamav_signatures:
  postgres_data:
  redis_data:
  auth_session_data:
  caddy_data:
  caddy_config:
  otel_offsets:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  ocr-scan:
    internal: true
  ocr-scanner-updates:
  default:
  telemetry-ingest:
    internal: true
  telemetry-storage:
    internal: true
  telemetry-proxy:
    internal: true
    ipam:
      config:
        - subnet: ${OBSERVABILITY_PROXY_SUBNET:-172.30.240.0/29}
