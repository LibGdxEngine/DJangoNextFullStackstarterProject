global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: applications
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: collector
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: caddy
    static_configs:
      - targets: ['caddy:9091']
  - job_name: grafana
    metrics_path: /grafana-metrics
    static_configs:
      - targets: ['caddy:9091']
