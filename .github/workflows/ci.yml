name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mobser_ci
          POSTGRES_USER: mobser_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U mobser_ci" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      DB_NAME: mobser_ci
      DB_USER: mobser_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/0
      CACHE_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-production-check-key-8a40fca97d714bb6a48f3112a6
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock pip-audit==2.10.0
      - run: python -m pip_audit -r backend/requirements.lock
      - run: python backend/manage.py check
      - run: python backend/manage.py check --deploy --fail-level WARNING --settings=core.settings.prod
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
        working-directory: backend
      - run: npm ci --prefix frontend
      - run: API_PYTHON=python make api-check
      - name: Check changed migrations for rolling compatibility
        run: python scripts/ci-migrations.py
      - run: python -m unittest discover -s deploy/tests -v
      - run: python -m unittest discover -s backend/tests -v
      - run: bash -n scripts/ci-smoke.sh deploy/ssh-dispatch.sh
      - run: python -m py_compile scripts/ci-migrations.py scripts/ci-release.py scripts/ci-smoke.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api
      NEXTAUTH_SECRET: ci-only-nextauth-secret-67839b0362a0
      NEXTAUTH_URL: http://localhost:3000
      BACKEND_API_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success
