# Private INSTREAM-only service. Never publish its TCP port to the host.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no
LogVerbose no
StreamMaxLength 151M
MaxFileSize 151M
MaxScanSize 300M
MaxScanTime 90000
MaxRecursion 16
MaxFiles 10000
MaxThreads 2
MaxQueue 10
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 500
AlertExceedsMax yes
AlertEncrypted yes
ScanPDF yes
ScanArchive yes
ConcurrentDatabaseReload no
